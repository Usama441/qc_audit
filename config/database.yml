default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "qc_audit_development" } %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST") { "qc_audit_test" } %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME") { "qc_audit_production" } %>
    username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
    password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME_CACHE") { ENV.fetch("DB_NAME") { "qc_audit_production" } } %>
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME_QUEUE") { ENV.fetch("DB_NAME") { "qc_audit_production" } } %>
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME_CABLE") { ENV.fetch("DB_NAME") { "qc_audit_production" } } %>
