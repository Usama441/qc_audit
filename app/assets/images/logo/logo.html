<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit QC Logo</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo-wrapper {
      width: 100%;
      max-width: 1150px;
      padding: 40px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .navy {
      fill: #061f4d;
    }

    .blue {
      fill: #1e73d8;
    }

    .light-line {
      stroke: #c9c9c9;
    }

    .tagline {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 12px;
      fill: #061f4d;
    }

    .main-text {
      font-size: 95px;
      font-weight: 800;
      letter-spacing: -4px;
    }

    .logo-shield {
      filter: drop-shadow(0px 4px 7px rgba(0, 0, 0, 0.12));
    }

    .logo-wrapper:hover .check {
      transform: scale(1.06);
      transform-origin: center;
      transition: 0.3s ease;
    }
  </style>
</head>

<body>

  <div class="logo-wrapper">
    <svg viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg">

      <!-- Shield Icon -->
      <g class="logo-shield" transform="translate(70, 35)">

        <!-- Outer Shield -->
        <path
          d="M150 0 
             L295 60 
             L295 170 
             C295 255 235 320 150 365 
             C65 320 5 255 5 170 
             L5 60 Z"
          fill="#061f4d"
        />

        <!-- Inner Shield Line -->
        <path
          d="M150 35
             L260 82
             L260 174
             C260 235 218 285 150 324
             C82 285 40 235 40 174
             L40 82 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="12"
        />

        <!-- Magnifier Circle -->
        <circle
          cx="145"
          cy="150"
          r="70"
          fill="none"
          stroke="#ffffff"
          stroke-width="18"
        />

        <!-- Magnifier Handle -->
        <line
          x1="195"
          y1="202"
          x2="250"
          y2="260"
          stroke="#ffffff"
          stroke-width="22"
          stroke-linecap="round"
        />

        <!-- Check Mark -->
        <path
          class="check"
          d="M105 150 L135 180 L190 98"
          fill="none"
          stroke="#1e73d8"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </g>

      <!-- Main Text -->
      <text x="470" y="190" class="main-text navy">Audit</text>
      <text x="885" y="190" class="main-text blue">QC</text>

      <!-- Divider Line -->
      <line
        x1="475"
        y1="235"
        x2="1185"
        y2="235"
        stroke-width="4"
        class="light-line"
      />

      <!-- Tagline -->
      <text x="475" y="300" class="tagline">
        QUALITY • COMPLIANCE • CONTROL
      </text>

    </svg>
  </div>

  <script>
    // Small JS example: download SVG as file
    document.querySelector(".logo-wrapper").addEventListener("dblclick", () => {
      const svg = document.querySelector("svg").outerHTML;
      const blob = new Blob([svg], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "audit-qc-logo.svg";
      a.click();

      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
